[package]
name = "wifi-qr-code-generator"
version = "0.1.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Skgland/Wifi-QR-Code-Generator"
readme = "Readme.md"
keywords = ["cli", "wifi", "wlan", "qr-code"]
categories = ["command-line-utilities"]
description = "A small CLI Utility for generating Wifi QR-Codes"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "wifi-qr-code-generator"
required-features = ["cli"]

[features]
default = ["qoi"]
cli = ["dep:clap"]
qoi = ["dep:arqoii"]

[dev-dependencies]
proptest = "1.7.0"

[dependencies]
qrcode = "0.14.1"
image = "0.25.6"
thiserror = "2.0.16"
base64 = "0.22.1"
clap = { version = "4.5.45", features = ["derive", "string"], optional = true }
arqoii = { version = "0.3.0", optional = true }
